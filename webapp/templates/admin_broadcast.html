{% extends "base.html" %}
{% block content %}
<h1>Рассылка всем (/o)</h1>

{% if result %}
<div class="alert ok">✅ Разослано: {{ result.sent }}, ошибок: {{ result.failed }}</div>
{% endif %}

<div class="panel">
  <form method="post">
    <label>Текст уведомления</label>
    <textarea name="text" required></textarea>
    <div style="margin-top:18px;">
      <button class="btn" type="submit">Отправить всем</button>
    </div>
  </form>
</div>
{% endblock %}
